<!DOCTYPE html>
<html>
    <head>
    <title>Style Page</title>
        <style>
            h1 {
            color: green; <!//-- sets the text color of the h1 element to green -->
            }
            a {
                background-color: pink; padding: 10px; margin: 5px; font-size: 30px; <!//-- sets the background color of the links to pink, adds padding and margin, and sets the font size to 30px -->
            }
            nav {
                background-color: lightblue; padding: 20px; <!//-- sets the background color of the nav element to light blue and adds padding -->
            }

            #homeButton { <!//-- selects the element with the id "homeButton" -->
                background-color: yellow; <!//-- sets the background color of the element with id "homeButton" to yellow -->
                padding: 10px; <!//-- adds padding around the element with id "homeButton" -->
                margin: 5px; <!//-- adds margin around the element with id "homeButton" -->
                font-size:30px; <!//-- sets the font size of the element with id "homeButton" to 30px -->
            }

        </style>     
    </head>        
    <body>
        <h1>Welcome to My Style Page</h1>
        <p>This is my style page from in class lessons..</p>

        </nav>

</html>
