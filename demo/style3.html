<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8"> <!//-- sets the character encoding of the document to UTF-8 -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
        <!//-- sets the viewport to the width of the device and initial zoom level to 1.0 -->
        <title>Document</title>
        <style>
           a{
            color: blue;
            font-size: 20px; <!//-- sets the font size of the links -->
            text-decoration: none; <!//-- removes underline from links -->
            border: 1px solid blue; <!//-- adds a blue border around the links -->
            background-color: white; <!//-- sets the background color of the links to white -->
            padding: 5px 20px; <!//-- adds padding around the links -->
            border-radius: 10px 10px 0 0; <!//-- rounds the top corners of the links -->
        }
        a:hover{
            color: blue; <!//-- changes the text color of the links to blue when hovered over -->
            border: 3px solid white; <!//-- changes the border of the links to white when hovered over -->
            background-color: darkblue; <!//-- changes the background color of the links to dark blue when hovered over -->
        }
        </style>
    </head>
    <body>
        <a href="index.html">Back to Home</a> <!//-- creates a link to the index.html page with the text "Back to Home" -->
        <body>
      
        <p>This is my style page showing how to customize links and hovering over...</p>

    </body>
</html>
