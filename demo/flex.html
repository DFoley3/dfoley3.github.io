<!DOCTYPE html>
<html lang="en">   
<head>
    <meta charset ="UTF-8"> <!-- Sets the character encoding for the document -->
    <meta name="viewport" content="width=device-width", initial-scale="1.0" /> <!-- Sets the viewport for responsive design -->
    <title>Flex Example</title>
    <style>
        .container { /*-- Styles for the flex container */
            border: 1px solid black; /*-- Adds a border around the container */
            padding: 10px; /*-- Adds padding inside the container */
            display: flex; /*-- Makes the container a flexbox */
            flex-wrap: wrap; /*-- Allows the items to wrap to the next line if they don't fit */
            width: 350px; /*-- Sets the width of the container */
            justify-content: center; /*-- Centers the items horizontally */
            gap: 5px; /*-- This creates the spacing between the items */
        }
        .item { /*-- Styles for the flex items */
            background-color: lightblue; /*-- Sets the background color of the items */
            padding: 20px; /*-- Adds padding inside the items */
            border: 1px solid #ccc; /*-- Adds a border around the items */
            width: 50px; /*-- Sets the width of the items */
            flex-grow:1; /*-- Allows the items to grow and fill the available space */

        }
    </style>
</head>
<body>
    <div class="container"> <!-- Flex container -->
        <div class="item">Item 1</div> <!-- Item 1 -->
        <div class="item">Item 2</div> <!-- Item 2 -->
        <div class="item">Item 3</div> <!-- Item 3 -->
        <div class="item">Item 4</div> <!-- Item 4 -->
        <div class="item">Item 5</div> <!-- Item 5 -->
    </div>
</body>
</html>
